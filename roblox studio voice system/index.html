<script>
    function verifyCode() {
        const code = document.getElementById('codeInput').value;
        const status = document.getElementById('statusMsg');

        if (code.length !== 6) {
            status.style.color = '#ff4d4d';
            status.innerText = 'يرجى إدخال كود مكون من 6 أرقام';
            return;
        }

        fetch(`/api/verify-code?code=${code}&action=submit`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    status.style.color = '#00ff66';
                    status.innerText = 'تم التفعيل بنجاح! ارجع إلى روبلوكس';
                } else {
                    status.style.color = '#ff4d4d';
                    status.innerText = 'الكود غير صحيح أو منتهي الصلاحية!';
                }
            })
            .catch(() => {
                status.style.color = '#ff4d4d';
                status.innerText = 'حدث خطأ في الاتصال!';
            });
    }
</script>
